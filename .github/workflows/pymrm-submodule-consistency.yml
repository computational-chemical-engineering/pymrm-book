name: Sync pymrm and publish book

on:
  schedule:
    # Run every Monday at 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: true

jobs:
  sync-and-build:
    name: Sync pymrm submodule, rebuild docs, and upload pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update pymrm submodule to latest main
        run: |
          git submodule update --init --remote --recursive pymrm
          git submodule status pymrm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./pymrm
          pip install -r requirements.txt

      - name: Install PDF renderer
        run: python -m playwright install --with-deps chromium

      - name: Regenerate API docs
        run: python3 scripts/generate_function_list.py

      - name: Commit and push updates if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pymrm content/api
          if git diff --staged --quiet; then
            echo "Submodule and API docs are already up to date – nothing to commit."
          else
            git commit -m "chore: sync pymrm submodule and regenerate API docs"
            git push
          fi

      - name: Execute lecture note notebooks
        timeout-minutes: 20
        run: python scripts/execute_book_notebooks.py

      - name: Build Jupyter Book (HTML)
        timeout-minutes: 10
        run: jupyter-book build --html --ci
        env:
          BASE_URL: /pymrm-book

      - name: Add per-page PDF downloads
        timeout-minutes: 10
        run: python scripts/add_page_pdf_downloads.py --base-url /pymrm-book

      - name: Disable Jekyll processing
        run: touch _build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: sync-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
